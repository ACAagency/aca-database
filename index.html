<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.C.A. CENTRAL ARCHIVE</title>
<style>
  :root {
    --bg-dark: #05070a;
    --bg-panel: #0b1118;
    --bg-card: rgba(15, 23, 33, 0.85);
    --border-main: #45a29e;
    --border-sub: #1f2d3d;
    --text-main: #66fcf1;
    --text-light: #e0e6ed;
    --text-mute: #6c7d93;
    --alert-red: #e63946;
    --accent-gold: #f4a261;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background-color: var(--bg-dark); 
    color: var(--text-light); 
    font-family: 'Courier New', Courier, -apple-system, BlinkMacSystemFont, monospace; 
    min-height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(15, 23, 33, 0.8) 0%, #030508 100%),
      linear-gradient(rgba(102, 252, 241, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(102, 252, 241, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
  }

  /* 📡 배경 심해 레이더 파동 애니메이션 */
  .radar-pulse {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 1px solid rgba(102, 252, 241, 0.2);
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.1);
    animation: pulseRing 6s infinite ease-out;
    pointer-events: none;
    z-index: 1;
  }
  .radar-pulse:nth-child(2) { animation-delay: 2s; }
  .radar-pulse:nth-child(3) { animation-delay: 4s; }

  @keyframes pulseRing {
    0% { width: 100px; height: 100px; opacity: 0.8; }
    100% { width: 1400px; height: 1400px; opacity: 0; }
  }

  /* 🟢 생체 인식 스캔 레이저 바 (위아래 반복 이동) */
  .scanner-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #66fcf1 20%, #45a29e 50%, #66fcf1 80%, transparent);
    box-shadow: 0 0 15px #66fcf1, 0 0 25px #45a29e;
    opacity: 0.45;
    z-index: 90;
    pointer-events: none;
    animation: scanMove 7s ease-in-out infinite alternate;
  }

  @keyframes scanMove {
    0% { top: 0%; opacity: 0.1; }
    15% { opacity: 0.6; }
    85% { opacity: 0.6; }
    100% { top: calc(100% - 3px); opacity: 0.1; }
  }

  /* CRT 스캔라인 & 비네팅 효과 */
  body::before {
    content: " ";
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 9999;
    background-size: 100% 3px, 6px 100%;
    pointer-events: none;
  }

  /* 🔐 로그인 오버레이 */
  #login-screen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(3, 5, 8, 0.95);
    z-index: 5000;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
  }
  
  .login-box {
    width: 90%;
    max-width: 440px;
    background: var(--bg-panel);
    border: 2px solid var(--border-main);
    padding: 35px 30px;
    box-shadow: 0 0 35px rgba(69, 162, 158, 0.25);
    border-radius: 4px;
    text-align: center;
    position: relative;
    z-index: 5001;
  }

  .login-title {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
    letter-spacing: 2px;
    margin-bottom: 25px;
    text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
  }

  .login-input {
    width: 100%;
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--border-sub);
    padding: 14px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 15px;
    outline: none;
    transition: 0.3s;
  }
  .login-input:focus { border-color: var(--text-main); box-shadow: 0 0 10px rgba(102, 252, 241, 0.2); }

  .login-btn {
    width: 100%;
    background: rgba(69, 162, 158, 0.15);
    color: var(--text-main);
    border: 1px solid var(--border-main);
    padding: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
  }
  .login-btn:hover {
    background: var(--border-main);
    color: #000;
    box-shadow: 0 0 15px rgba(102, 252, 241, 0.6);
  }

  /* 🖥️ 풀스크린 메인 터미널 레이아웃 */
  .terminal-box { 
    width: 96vw; 
    max-width: 1600px;
    height: 92vh; 
    background: var(--bg-panel); 
    border: 1px solid var(--border-main); 
    border-radius: 6px; 
    box-shadow: 0 0 35px rgba(69, 162, 158, 0.15); 
    display: flex; 
    flex-direction: column; 
    overflow: hidden;
    position: relative;
    z-index: 10;
  }

  .header { 
    background: #030508; 
    padding: 14px 25px; 
    border-bottom: 1px solid var(--border-main); 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    z-index: 20;
  }

  .logo-btn {
    background: none;
    border: none;
    color: var(--text-main);
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: 0.3s;
    text-shadow: 0 0 8px rgba(102, 252, 241, 0.4);
  }
  .logo-btn:hover {
    color: #fff;
    text-shadow: 0 0 15px rgba(102, 252, 241, 0.8);
    transform: scale(1.02);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .nav-status {
    font-size: 12px;
    padding: 5px 10px;
    background: rgba(244, 162, 97, 0.1);
    color: var(--accent-gold);
    border: 1px solid var(--accent-gold);
    border-radius: 3px;
    cursor: pointer;
    transition: 0.3s;
  }
  .nav-status:hover { background: var(--accent-gold); color: #000; }

  .bgm-btn {
    background: transparent;
    color: var(--text-main);
    border: 1px solid var(--border-main);
    padding: 6px 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .bgm-btn.active { background: var(--alert-red); border-color: var(--alert-red); color: #fff; }

  .view-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .view-pane {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow-y: auto;
    padding: 30px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(15px);
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s;
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .view-pane.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* 🛒 SHOP */
  .rank-selector { 
    display: flex; 
    gap: 10px; 
    justify-content: center; 
    margin-bottom: 25px; 
    flex-wrap: wrap; 
  }
  .rank-btn {
    background: rgba(0,0,0,0.5); 
    border: 1px solid var(--border-sub); 
    color: var(--text-mute);
    padding: 10px 20px; 
    font-family: inherit; 
    font-weight: bold; 
    font-size: 13px;
    cursor: pointer; 
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 1px;
  }
  .rank-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); transform: translateY(-2px); }
  .rank-btn.active { 
    background: rgba(244, 162, 97, 0.15); 
    border-color: var(--accent-gold); 
    color: #fff; 
    box-shadow: 0 0 15px rgba(244, 162, 97, 0.25);
  }

  .char-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); 
    gap: 25px; 
    padding-bottom: 30px;
  }

  .char-card {
    display: flex; 
    gap: 20px; 
    background: var(--bg-card); 
    border: 1px solid var(--border-sub); 
    padding: 20px; 
    border-radius: 4px; 
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(8px);
  }
  .char-card:hover { 
    border-color: var(--border-main); 
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.12); 
    transform: translateY(-3px);
  }
  
  .char-img-box {
    width: 200px; 
    height: 280px; 
    flex-shrink: 0; 
    background: #000; 
    border: 1px solid var(--border-sub); 
    overflow: hidden; 
    position: relative;
  }
  .char-img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    opacity: 0.85; 
    transition: 0.5s ease; 
    filter: contrast(1.1); 
  }
  .char-card:hover .char-img { opacity: 1; transform: scale(1.06); }
  
  .char-info { flex: 1; display: flex; flex-direction: column; }
  .char-header { border-bottom: 1px solid var(--border-sub); padding-bottom: 8px; margin-bottom: 12px; }
  .char-code { color: var(--text-main); font-size: 13px; font-weight: bold; margin-bottom: 4px; }
  .char-name { color: #fff; font-size: 22px; font-weight: bold; }
  
  .info-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .badge { padding: 4px 8px; font-size: 11px; font-weight: bold; border: 1px solid; border-radius: 3px; }
  
  .char-desc-list { 
    margin-bottom: 15px; 
    color: var(--text-light); 
    font-size: 13px; 
    line-height: 1.6; 
    padding-left: 18px; 
  }
  .char-desc-list li { margin-bottom: 6px; }

  .extraction-box {
    margin-top: auto; 
    background: rgba(230, 57, 70, 0.08); 
    border-left: 3px solid var(--alert-red); 
    padding: 12px 15px;
  }
  .ext-title { color: var(--alert-red); font-weight: bold; font-size: 12px; margin-bottom: 6px; letter-spacing: 1px; }

  .locked-screen {
    text-align: center; 
    padding: 80px 20px; 
    background: rgba(230, 57, 70, 0.04); 
    border: 1px dashed var(--alert-red);
    grid-column: 1 / -1;
  }

  /* 📖 OVERVIEW */
  .overview-container { max-width: 1000px; margin: 0 auto; width: 100%; }
  .sub-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border-sub); flex-wrap: wrap; }
  .sub-btn { 
    background: none; border: none; padding: 10px 18px; color: var(--text-mute); font-family: inherit; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; 
  }
  .sub-btn.active { color: var(--text-main); border-bottom: 2px solid var(--text-main); background: rgba(69, 162, 158, 0.05); }

  .section-title { color: #fff; font-size: 22px; margin-bottom: 15px; }
  .desc-box { background: rgba(0,0,0,0.5); border: 1px dashed var(--border-sub); padding: 20px; border-radius: 4px; margin-bottom: 20px; line-height: 1.7; }
  .highlight { color: var(--alert-red); font-weight: bold; }
  .doc-list { padding-left: 20px; line-height: 1.8; font-size: 14px; }
  .doc-list li { margin-bottom: 8px; }

  @media screen and (max-width: 900px) {
    .terminal-box { width: 100vw; height: 100vh; border-radius: 0; border: none; }
    .char-grid { grid-template-columns: 1fr; }
    .char-card { flex-direction: column; }
    .char-img-box { width: 100%; height: 260px; }
    .view-pane { padding: 15px; }
  }
</style>
</head>
<body>

<!-- 📡 배경 레이더 파동 링 -->
<div class="radar-pulse"></div>

<div class="radar-pulse"></div>

<!-- 🔒 인트라넷 로그인 콘솔 -->
<div id="login-screen">
  <div class="login-box">
    <div style="font-size: 32px; margin-bottom: 10px;">⚠️</div>
    <div class="login-title">[ A.C.A. INTRANET ACCESS ]</div>
    <p style="font-size: 12px; color: var(--text-mute); margin-bottom: 20px;">
      본 시스템은 제3관리국 인가 인원 전용 단말기입니다.<br>무단 침입 시 즉각 처분 프로토콜이 집행됩니다.
    </p>
    <input type="text" class="login-input" placeholder="HANDLER ID / CODE" value="ADMIN-HANDLER-08">

<!-- 백그라운드 BGM 플레이어 -->

<div class="terminal-box">

  <div class="scanner-line"></div>

    <!-- 📖 OVERVIEW 뷰 -->
    <div class="view-pane" id="overview-view">
      <div class="overview-container">

    </div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* 🔐 로그인 연출 */
function authenticate() {
  const btn = document.querySelector('.login-btn');
  btn.innerHTML = "VERIFYING SECURITY CLEARANCE...";
  btn.style.background = "var(--alert-red)";
  btn.style.color = "#fff";
  
  setTimeout(() => {
    const screen = document.getElementById('login-screen');
    screen.style.opacity = '0';
    setTimeout(() => {
      screen.style.visibility = 'hidden';
      toggleBGM();
    }, 600);
  }, 500);
}

/* 📻 BGM 시스템 */
let player;
let isPlaying = false;
let isPlayerReady = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '0', width: '0', videoId: '4xDzrJKXOOY',
    playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1 },
    events: { 'onReady': () => { isPlayerReady = true; } }
  });
}

function toggleBGM() {
  const btn = document.getElementById('bgmBtn');
  if (!isPlayerReady) return;
  if (!isPlaying) {
    player.playVideo(); isPlaying = true;
    btn.innerHTML = "📻 RADIO: ON 🔴"; btn.classList.add('active');
  } else {
    player.pauseVideo(); isPlaying = false;
    btn.innerHTML = "📻 RADIO: OFF"; btn.classList.remove('active');
  }
}

/* 📖 LORE 데이터 ('제5' 제외 반영) */
const loreData = {
  genesis: `
    <h2 class="section-title">1. 기원 및 배경 (The Genesis)</h2>
    <ul class="doc-list">
      <li>수십 년 전, 원인 불명의 전 지구적 변이성 전염병 <b>'원형 바이러스(Proto-Pathogen)'</b> 발발.</li>
      <li>생물의 진화를 기형적으로 촉진하고 무생물에 생체 반응을 부여해 지능형 이형체 대거 탄생.</li>
      <li>이를 체계적으로 포획, 격리, 감시하기 위해 설립된 국가 직속 최고 권한 통제 기관이 바로 <b>A.C.A.</b>임.</li>
    </ul>
    <div class="desc-box">
      <b>[협회 운영 방침]</b><br>
      인외를 '지능을 가진 생명'으로 취급하지 않음. 국가 안전을 위협하는 <span class="highlight">'잠재적 재앙 물질'이자 '관리 대상 표본'</span>으로만 규정.<br>
      가혹하고 기계적인 통제 아래 24시간 감시, 신경 억제, 물리적 구속이 합법적으로 집행됨.
    </div>
  `,
  structure: `
    <h2 class="section-title">2. 시설 구조 및 6단계 구속 등급</h2>
    <ul class="doc-list">
      <li><b>지상:</b> 철저한 위장막과 다중 보안 방벽으로 둘러싸인 거대 연구 관공서 빌딩 군.</li>
      <li><b>지하:</b> 수천 미터 깊이까지 수직으로 뚫려 있는 초대형 방공호 및 벙커 형태의 지하 요새.</li>
      <li><b>정기 완충 시간:</b> 장기 수감 붕괴 방지를 위해 하루 30분간 공용 홀에서 집행 (충돌 시 신경 억제 가스 살포).</li>
    </ul>
    <div class="desc-box">
      <b>[A.C.A. 프로토콜: 6단계 구속 수준 체계]</b><br>
      • <b>Level D:</b> 발목 억제 앵클릿, 위치 추적기<br>
      • <b>Level C:</b> 경량 신경 억제 목걸이 부착<br>
      • <b>Level B:</b> 상체 금속 억제 사슬 및 전격 방출형 목걸이<br>
      • <b>Level A:</b> 척추/관절 초고압 억제 프레임, 분비물 억제 마스크<br>
      • <b>Level S:</b> 신경 전도 차단 수트, 사지 영구 결박, 24시간 진정제 강제 링거<br>
      • <b>Level 특급:</b> 감각 완전 차단 캡슐 밀봉, 의식 강제 동면 상태 유지
    </div>
  `,
  deepsea: `
    <h2 class="section-title">3. 심해 수중 격리구역 (Deep-Sea Sector)</h2>
    <div class="desc-box">
      지하 최심부, 초고압과 칠흑 같은 암흑을 재현한 '초대형 심해 인공 해역'. 완전 수생 인외(아야나, 지세르 등) 영구 격리.
    </div>

let currentView = 'shop';

function switchView(viewName) {
  currentView = viewName;
  const shopPane = document.getElementById('shop-view');
  const overviewPane = document.getElementById('overview-view');
  const toggleBtn = document.getElementById('viewToggleBtn');

  if (viewName === 'shop') {
    overviewPane.classList.remove('active');
    setTimeout(() => { shopPane.classList.add('active'); }, 150);
    toggleBtn.innerHTML = "CATALOG : SHOP 🔴";
    toggleBtn.style.color = "var(--accent-gold)";
    toggleBtn.style.borderColor = "var(--accent-gold)";
  } else {
    shopPane.classList.remove('active');
    setTimeout(() => { overviewPane.classList.add('active'); }, 150);
    toggleBtn.innerHTML = "ARCHIVE : OVERVIEW ⚙️";
    toggleBtn.style.color = "var(--text-main)";
    toggleBtn.style.borderColor = "var(--text-main)";
    loadLore('genesis', document.querySelector('.sub-btn'));
  }
}

function toggleCurrentView() {
  switchView(currentView === 'shop' ? 'overview' : 'shop');
}

function loadLore(key, btnElem) {
  document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
  if (btnElem) btnElem.classList.add('active');
  document.getElementById('lore-content').innerHTML = loreData[key];
}

function loadRank(rank, btnElem) {
  document.querySelectorAll('.rank-btn').forEach(btn => btn.classList.remove('active'));
  if (btnElem) btnElem.classList.add('active');
  
  const container = document.getElementById('rank-content');
  const list = characters[rank];

  if (!list || list.length === 0) {
    container.innerHTML = `
      <div class="locked-screen">
        <div style="font-size: 38px; margin-bottom: 15px;">🔒</div>
        <div style="color: var(--alert-red); font-size: 20px; font-weight: bold; margin-bottom: 10px;">
          [ ACCESS RESTRICTED : DATA INSUFFICIENT ]
        </div>
        <p style="color: var(--text-mute); font-size: 13px; line-height: 1.6;">
          경고: 해당 구속 등급의 표본 아카이브는 현재 갱신 중이거나 보안 승인이 거부되었습니다.<br>
          담당 관리관의 보안 승인 코드를 재확인하십시오.
        </p>
      </div>
    `;
    return;
  }

  let html = '';
  list.forEach(char => {
    let badgeCol = badgeStyles[char.rank.split(' ')[0] + ' ' + char.rank.split(' ')[1]] || "color: #fff; border-color: #fff;";
    html += `
      <div class="char-card">
        <div class="char-img-box">
          <img src="${char.img}" alt="${char.name}" class="char-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' fill=\\'none\\' viewBox=\\'0 0 24 24\\' stroke=\\'%2345a29e\\'><path stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' stroke-width=\\'1\\' d=\\'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z\\'/></svg>'">
        </div>
        <div class="char-info">
          <div class="char-header">
            <div class="char-code">[ ${char.code} ]</div>
            <div class="char-name">${char.name}</div>
          </div>
          <div class="info-row">
            <span class="badge" style="${badgeCol}">${char.rank}</span>
            <span class="badge" style="color:#c5c6c7; border-color:#c5c6c7;">${char.species}</span>
            <span class="badge" style="color:#7a7a7a; border-color:#7a7a7a;">${char.location}</span>
          </div>
          <ul class="char-desc-list">
            <li><b>외형:</b> ${char.appearance}</li>
            <li><b>성격:</b> ${char.desc}</li>
            <li><b>기믹:</b> ${char.gimmick}</li>
          </ul>
          <div class="extraction-box">
            <div class="ext-title">⚠️ EXTRACTION RESOURCE (착취 자원)</div>
            <div style="color: #d3d3d3; font-size: 13px;">${char.extraction}</div>
          </div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}
