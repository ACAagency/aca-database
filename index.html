<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.C.A. CENTRAL ARCHIVE</title>
<style>
  :root {
    --bg-dark: #050505;
    --bg-panel: #0f151b;
    --bg-tab: #0b0c10;
    --border-main: #45a29e;
    --border-sub: #1f2833;
    --text-main: #66fcf1;
    --text-light: #c5c6c7;
    --text-mute: #7a7a7a;
    --alert-red: #e63946;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background-color: var(--bg-dark); 
    color: var(--text-light); 
    font-family: 'Courier New', Courier, -apple-system, sans-serif; 
    padding: 15px; 
    display: flex; 
    justify-content: center; 
    min-height: 100vh; 
    background-image: 
      linear-gradient(rgba(102, 252, 241, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(102, 252, 241, 0.03) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  
  /* 메인 터미널 박스 */
  .terminal-box { 
    width: 100%; 
    max-width: 1200px; 
    background: var(--bg-panel); 
    border: 1px solid var(--border-main); 
    border-radius: 4px; 
    box-shadow: 0 0 20px rgba(69, 162, 158, 0.1); 
    display: flex; 
    flex-direction: column; 
    min-height: 85vh;
    position: relative;
    overflow: hidden;
  }

  /* 스캔라인 효과 */
  .terminal-box::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 100;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }
  
  /* 헤더 & 라디오 버튼 */
  .header { 
    background: var(--bg-dark); 
    padding: 15px 25px; 
    border-bottom: 1px solid var(--border-main); 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    z-index: 10;
  }
  
  .header-logo {
    font-size: 18px;
    font-weight: bold;
    color: var(--text-main);
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(102, 252, 241, 0.4);
  }

  .bgm-btn {
    background: transparent;
    color: var(--text-main);
    border: 1px solid var(--border-main);
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .bgm-btn.active { background: var(--alert-red); border-color: var(--alert-red); color: #fff; }

  /* 메인 네비게이션 (OVERVIEW vs SHOP) */
  .top-nav {
    display: flex;
    background: var(--bg-tab);
    border-bottom: 1px solid var(--border-sub);
    z-index: 10;
  }
  .nav-tab {
    flex: 1;
    padding: 16px;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--text-mute);
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 1px;
    transition: 0.3s;
  }
  .nav-tab:hover { color: var(--text-light); }
  .nav-tab.active {
    color: var(--text-main);
    background: rgba(69, 162, 158, 0.05);
    border-bottom: 2px solid var(--text-main);
  }
  .nav-tab.shop-tab { color: #f4a261; }
  .nav-tab.shop-tab.active { border-bottom-color: #f4a261; background: rgba(244, 162, 97, 0.05); }

  /* 콘텐츠 컨테이너 */
  .content-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 30px;
    z-index: 10;
  }

  /* 부드러운 페이드인 모션 */
  .fade-in { animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 서브 탭 (Overview 내부용) */
  .sub-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-sub); flex-wrap: wrap; }
  .sub-btn { background: none; border: none; padding: 10px 15px; color: var(--text-mute); font-family: inherit; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .sub-btn.active { color: var(--text-main); border-bottom: 2px solid var(--text-main); }

  /* 본문 타이포그래피 */
  .section-title { color: #fff; font-size: 22px; margin-bottom: 15px; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
  .desc-box { background: rgba(0,0,0,0.4); border: 1px dashed var(--border-sub); padding: 20px; border-radius: 4px; margin-bottom: 20px; line-height: 1.6; }
  .highlight { color: var(--alert-red); font-weight: bold; }
  ul { padding-left: 20px; line-height: 1.7; }
  li { margin-bottom: 8px; }

  /* SHOP 등급 선택기 */
  .rank-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
  .rank-btn {
    background: transparent; border: 1px solid var(--border-sub); color: var(--text-mute);
    padding: 10px 20px; font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.3s;
  }
  .rank-btn:hover { border-color: #f4a261; color: #f4a261; }
  .rank-btn.active { background: rgba(244, 162, 97, 0.15); border-color: #f4a261; color: #fff; }

  /* 캐릭터 카드 레이아웃 */
  .char-grid { display: flex; flex-direction: column; gap: 40px; }
  .char-card {
    display: flex; gap: 25px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-sub); padding: 20px; border-radius: 4px; transition: 0.3s;
  }
  .char-card:hover { border-color: var(--border-main); box-shadow: 0 0 15px rgba(102, 252, 241, 0.1); }
  
  .char-img-box {
    width: 250px; flex-shrink: 0; height: 350px; background: #000; border: 1px solid var(--border-sub); position: relative; overflow: hidden;
  }
  .char-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: 0.5s; filter: grayscale(20%) contrast(1.1); }
  .char-card:hover .char-img { opacity: 1; transform: scale(1.05); filter: grayscale(0%); }
  
  .char-info { flex: 1; display: flex; flex-direction: column; }
  .char-header { border-bottom: 1px solid var(--border-sub); padding-bottom: 10px; margin-bottom: 15px; }
  .char-code { color: var(--text-main); font-size: 14px; font-weight: bold; margin-bottom: 5px; }
  .char-name { color: #fff; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
  
  .info-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
  .badge { padding: 4px 8px; font-size: 12px; font-weight: bold; border: 1px solid; border-radius: 3px; }
  
  .extraction-box {
    margin-top: auto; background: rgba(230, 57, 70, 0.05); border-left: 3px solid var(--alert-red); padding: 15px;
  }
  .ext-title { color: var(--alert-red); font-weight: bold; font-size: 14px; margin-bottom: 8px; letter-spacing: 1px; }

  /* 보안 접근 제한 화면 */
  .locked-screen {
    text-align: center; padding: 60px 20px; background: rgba(230, 57, 70, 0.05); border: 1px dashed var(--alert-red);
  }
  .locked-icon { font-size: 40px; margin-bottom: 15px; }
  .locked-title { color: var(--alert-red); font-size: 24px; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }

  @media screen and (max-width: 800px) {
    .char-card { flex-direction: column; }
    .char-img-box { width: 100%; height: 300px; }
    .content-container { padding: 15px; }
    .nav-tab { font-size: 14px; padding: 12px; }
  }
</style>
</head>

/* BGM 로직 */
let player;
let isPlaying = false;
let isPlayerReady = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '0', width: '0', videoId: '4xDzrJKXOOY',
    playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1 },
    events: { 'onReady': () => { isPlayerReady = true; } }
  });
}

function toggleBGM() {
  const btn = document.getElementById('bgmBtn');
  if (!isPlayerReady) return alert("오디오 로딩 중입니다. 잠시 후 클릭해주세요.");
  if (!isPlaying) {
    player.playVideo(); isPlaying = true;
    btn.innerHTML = "📻 RADIO: ON 🔴"; btn.classList.add('active');
  } else {
    player.pauseVideo(); isPlaying = false;
    btn.innerHTML = "📻 RADIO: OFF"; btn.classList.remove('active');
  }
}

      desc: "나긋나긋한 존댓말을 쓰지만 사고방식이 뒤틀린 사이코패스 의사.",
      gimmick: "등 뒤의 붉은 생체 기계 촉수와 메스를 쥔 수술팔(서브 암). 관리인을 '자신이 치료할 환자' 취급하며 메스를 들이댐.",
      extraction: "생체 기계 촉수의 재생 조직 및 개조 바이러스 혈청 (추정)."
    }
  ],
  "S": [], // 미등록
  "SP": [] // 미등록 (특급)
};

const badgeStyles = {
  "Level D": "color: #a8dadc; border-color: #a8dadc;",
  "Level C": "color: #2a9d8f; border-color: #2a9d8f;",
  "Level B": "color: #e9c46a; border-color: #e9c46a;",
  "Level A": "color: #f4a261; border-color: #f4a261;",
  "Level S": "color: #e63946; border-color: #e63946;"
};

/* 화면 렌더링 함수 */
function switchMainTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
  document.querySelector(tab === 'overview' ? '.nav-tab:not(.shop-tab)' : '.shop-tab').classList.add('active');
  
  const content = document.getElementById('main-content');
  content.innerHTML = '';
  
  // 리렌더링 페이드 애니메이션 트릭
  content.classList.remove('fade-in');
  void content.offsetWidth; 
  content.classList.add('fade-in');

  if (tab === 'overview') {
    content.innerHTML = `
      <div class="sub-tabs">
        <button class="sub-btn active" onclick="loadLore('genesis', this)">협회 시스템</button>
        <button class="sub-btn" onclick="loadLore('structure', this)">시설 및 구조</button>
        <button class="sub-btn" onclick="loadLore('deepsea', this)">제5 심해 구역</button>
        <button class="sub-btn" onclick="loadLore('handler', this)">관리인 수칙</button>
      </div>
      <div id="lore-content">${loreData.genesis}</div>
    `;
  } else {
    content.innerHTML = `
      <div class="rank-selector">
        <button class="rank-btn" onclick="loadRank('D', this)">LEVEL D</button>
        <button class="rank-btn" onclick="loadRank('C', this)">LEVEL C</button>
        <button class="rank-btn active" onclick="loadRank('B', this)">LEVEL B</button>
        <button class="rank-btn" onclick="loadRank('A', this)">LEVEL A</button>
        <button class="rank-btn" onclick="loadRank('S', this)">LEVEL S</button>
        <button class="rank-btn" onclick="loadRank('SP', this)">특급(SPECIAL)</button>
      </div>
      <div id="rank-content" class="char-grid"></div>
    `;
    loadRank('B', document.querySelector('.rank-selector .rank-btn:nth-child(3)'));
  }
}

function loadLore(key, btnElem) {
  document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
  btnElem.classList.add('active');
  document.getElementById('lore-content').innerHTML = loreData[key];
}

function loadRank(rank, btnElem) {
  document.querySelectorAll('.rank-btn').forEach(btn => btn.classList.remove('active'));
  btnElem.classList.add('active');
  
  const container = document.getElementById('rank-content');
  const list = characters[rank];

  if (!list || list.length === 0) {
    container.innerHTML = `
      <div class="locked-screen">
        <div class="locked-icon">🔒</div>
        <div class="locked-title">[ ACCESS RESTRICTED : DATA INSUFFICIENT ]</div>
        <p style="color: var(--text-mute); line-height: 1.6;">
          경고: 해당 구속 등급의 표본 아카이브는 현재 갱신 중이거나 보안 승인이 거부되었습니다.<br>
          담당 관리관의 보안 승인 코드를 재확인하십시오.
        </p>
      </div>
    `;
    return;
  }

  let html = '';
  list.forEach(char => {
    let badgeCol = badgeStyles[char.rank.split(' ')[0] + ' ' + char.rank.split(' ')[1]] || "color: #fff; border-color: #fff;";
    html += `
      <div class="char-card">
        <div class="char-img-box">
          <img src="${char.img}" alt="${char.name}" class="char-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' fill=\\'none\\' viewBox=\\'0 0 24 24\\' stroke=\\'%2345a29e\\'><path stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' stroke-width=\\'1\\' d=\\'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z\\'/></svg>'">
        </div>
        <div class="char-info">
          <div class="char-header">
            <div class="char-code">[ ${char.code} ]</div>
            <div class="char-name">${char.name}</div>
          </div>
          <div class="info-row">
            <span class="badge" style="${badgeCol}">${char.rank}</span>
            <span class="badge" style="color:#c5c6c7; border-color:#c5c6c7;">${char.species}</span>
            <span class="badge" style="color:#7a7a7a; border-color:#7a7a7a;">${char.location}</span>
          </div>
          <ul style="margin-bottom: 20px; color: var(--text-light); font-size: 14px;">
            <li><b>외형:</b> ${char.appearance}</li>
            <li><b>성격:</b> ${char.desc}</li>
            <li><b>기믹:</b> ${char.gimmick}</li>
          </ul>
          <div class="extraction-box">
            <div class="ext-title">⚠️ EXTRACTION RESOURCE (착취 자원)</div>
            <div style="color: #d3d3d3; font-size: 14px;">${char.extraction}</div>
          </div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// 초기 로드
window.addEventListener('DOMContentLoaded', () => {
  switchMainTab('overview');
});
</script>
</body>
</html>
