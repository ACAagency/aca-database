<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.C.A. CENTRAL ARCHIVE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background-color: #050505; 
    color: #66fcf1; 
    font-family: 'Courier New', Courier, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; 
    padding: 15px; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }
  
  .terminal-box { 
    width: 100%; 
    max-width: 1300px; 
    background: #0f151b; 
    border: 2px solid #45a29e; 
    border-radius: 8px; 
    box-shadow: 0 0 30px rgba(69, 162, 158, 0.15); 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    min-height: 85vh;
  }
  
  .header { 
    background: #050505; 
    padding: 14px 20px; 
    border-bottom: 2px solid #45a29e; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    font-weight: bold; 
    letter-spacing: 1.5px; 
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .warning { 
    color: #e63946; 
    animation: blink 2s infinite; 
    font-size: 13px;
  }
  
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  
  .bgm-btn {
    background: rgba(69, 162, 158, 0.1);
    color: #66fcf1;
    border: 1px solid #45a29e;
    padding: 6px 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .bgm-btn:hover {
    background: #45a29e;
    color: #050505;
    box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
  }
  
  .container { 
    display: flex; 
    flex: 1; 
    min-height: 550px;
  }
  
  .sidebar { 
    width: 280px; 
    flex-shrink: 0;
    background: #0b0c10; 
    border-right: 1px solid #1f2833; 
    padding: 15px; 
    overflow-y: auto; 
  }
  
  .menu-category { 
    color: #45a29e; 
    font-size: 12px; 
    margin: 15px 0 8px 0; 
    border-bottom: 1px solid #1f2833; 
    padding-bottom: 4px; 
    font-weight: bold;
  }
  .menu-category:first-child { margin-top: 0; }
  
  .char-btn { 
    width: 100%; 
    background: transparent; 
    color: #c5c6c7; 
    border: 1px solid #1f2833; 
    padding: 12px 14px; 
    margin-bottom: 8px; 
    text-align: left; 
    cursor: pointer; 
    font-family: inherit; 
    font-size: 14px; 
    transition: all 0.2s ease; 
    border-radius: 4px; 
    display: block;
  }
  .char-btn:hover { border-color: #45a29e; color: #66fcf1; }
  .char-btn.active { background: rgba(69, 162, 158, 0.15); border-left: 4px solid #66fcf1; color: #ffffff; font-weight: bold; }
  
  .content-area { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    background: #0f151b;
    overflow: hidden;
  }
  
  .content-header { 
    padding: 20px 25px 15px 25px; 
    border-bottom: 1px solid #1f2833; 
  }
  
  .title { 
    color: #ffffff; 
    font-size: 24px; 
    margin: 0 0 10px 0; 
    font-weight: bold; 
    word-break: keep-all;
  }
  
  .badge { 
    display: inline-block; 
    padding: 4px 8px; 
    border-radius: 4px; 
    font-weight: bold; 
    font-size: 12px; 
    border: 1px solid currentColor; 
    margin-right: 6px; 
    margin-bottom: 6px;
  }
  
  .sub-tabs { 
    display: flex; 
    gap: 8px; 
    padding: 0 25px; 
    background: #0b0c10; 
    border-bottom: 1px solid #1f2833; 
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  
  .sub-tab-btn { 
    background: transparent; 
    color: #7a7a7a; 
    border: none; 
    border-bottom: 3px solid transparent; 
    padding: 12px 15px; 
    cursor: pointer; 
    font-family: inherit; 
    font-size: 14px; 
    font-weight: bold; 
    transition: 0.2s; 
    flex-shrink: 0;
  }
  .sub-tab-btn:hover { color: #c5c6c7; }
  .sub-tab-btn.active { color: #66fcf1; border-bottom: 3px solid #66fcf1; }
  
  .sub-content-area { 
    padding: 25px; 
    overflow-y: auto; 
    flex: 1; 
    color: #d3d3d3; 
    line-height: 1.75; 
    font-size: 15px; 
  }
  
  .desc-box { 
    background: rgba(0, 0, 0, 0.4); 
    border: 1px dashed #1f2833; 
    padding: 16px; 
    border-radius: 4px; 
    margin-bottom: 16px; 
    word-break: keep-all;
  }
  
  .highlight { color: #e63946; font-weight: bold; }
  ul { margin-top: 6px; padding-left: 20px; }
  li { margin-bottom: 8px; word-break: keep-all; }

  @media screen and (max-width: 860px) {
    body { padding: 8px; }
    .terminal-box { min-height: 95vh; }
    .container { flex-direction: column; min-height: auto; }
    .sidebar { 
      width: 100%; 
      border-right: none; 
      border-bottom: 2px solid #45a29e; 
      padding: 12px;
      max-height: 200px;
    }
    .content-area { width: 100%; flex: 1; }
    .content-header { padding: 15px; }
    .title { font-size: 20px; }
    .sub-tabs { padding: 0 12px; }
    .sub-content-area { padding: 16px; font-size: 14px; line-height: 1.65; }
    .header { padding: 12px 15px; font-size: 13px; }
  }
</style>
</head>
<body>

<!-- 무제한 공식 스트리밍 오디오 -->
<audio id="bgmAudio" preload="none">
  <source src="https://radio.plaza.one/mp3" type="audio/mp3">
</audio>

<div class="terminal-box">
  <div class="header">
    <div class="header-left">
      <span>[ A.C.A. DATABASE ]</span>
      <span class="warning">SEC-LEVEL: HANDLER</span>
    </div>
    <button class="bgm-btn" id="bgmBtn" onclick="toggleBGM()">📻 SYNTHWAVE RADIO : OFF</button>
  </div>
  
  <div class="container">
    <div class="sidebar">
      <div class="menu-category">📂 AGENCY PROTOCOL</div>
      <button class="char-btn active" onclick="loadMainData('agency', this)">협회 개요 및 시스템</button>
      <button class="char-btn" onclick="loadMainData('deepsea', this)">제5 심해 구역 & 관리인</button>

      <div class="menu-category">⚠️ SUBJECT ARCHIVE</div>
      <button class="char-btn" onclick="loadMainData('karue', this)">[A-084] 카르에</button>
      <button class="char-btn" onclick="loadMainData('ayana', this)">[D-007] 아야나</button>
      <button class="char-btn" onclick="loadMainData('giselle', this)">[B-012] 지세르</button>
      <button class="char-btn" onclick="loadMainData('dezel', this)">[B-041] 데젤</button>
      <button class="char-btn" onclick="loadMainData('iris', this)">[A-019] 아이리스</button>
    </div>
    
    <div class="content-area">
      <div class="content-header" id="content-header"></div>
      <div class="sub-tabs" id="sub-tabs"></div>
      <div class="sub-content-area" id="sub-content-area"></div>
    </div>
  </div>
</div>

<script>
const bgm = document.getElementById('bgmAudio');
const bgmBtn = document.getElementById('bgmBtn');
let isPlaying = false;

function toggleBGM() {
  if (!isPlaying) {
    bgm.play().then(() => {
      isPlaying = true;
      bgmBtn.innerHTML = "📻 SYNTHWAVE RADIO : ON 🔴";
      bgmBtn.style.background = "#e63946";
      bgmBtn.style.borderColor = "#e63946";
      bgmBtn.style.color = "#ffffff";
    }).catch(err => {
      console.log("재생 차단:", err);
      alert("브라우저에서 음악 재생을 허용해 주세요!");
    });
  } else {
    bgm.pause();
    isPlaying = false;
    bgmBtn.innerHTML = "📻 SYNTHWAVE RADIO : OFF";
    bgmBtn.style.background = "rgba(69, 162, 158, 0.1)";
    bgmBtn.style.borderColor = "#45a29e";
    bgmBtn.style.color = "#66fcf1";
  }
}

const badgeColors = {
  "Level S": "color: #e63946; background: rgba(230, 57, 70, 0.1);",
  "Level A": "color: #f4a261; background: rgba(244, 162, 97, 0.1);",
  "Level B": "color: #e9c46a; background: rgba(233, 196, 106, 0.1);",
  "Level C": "color: #a8dadc; background: rgba(168, 218, 220, 0.1);",
  "Level D": "color: #2a9d8f; background: rgba(42, 157, 143, 0.1);",
  "SYSTEM": "color: #66fcf1; background: rgba(102, 252, 241, 0.1);"
};

const db = {
  agency: {
    title: "A.C.A. (중앙 이형체 통제 협회)",
    badges: ["SYSTEM", "CLASSIFIED"],
    tabs: [
      {
        tabName: "기원 및 배경",
        content: `
          <ul>
            <li>수십 년 전, 원인 불명의 전 지구적 변이성 전염병 <b>'원형 바이러스(Proto-Pathogen)'</b>가 발발[cite: 1].</li>
            <li>해당 전염병은 생물의 진화를 기형적으로 촉진하고, 무생물에 생체 반응 및 영속적 생명을 부여하는 초자연적 현상을 유발함[cite: 1].</li>
            <li>그 결과 인간을 위협하는 지능형 이형체(인외)들이 대거 탄생함[cite: 1].</li>
            <li>범국가적 비상사태 속에서 이형체를 체계적으로 포획, 격리, 감시하기 위해 설립된 최고 권한의 국가 직속 통제 기관이 바로 'A.C.A.'임[cite: 1].</li>
          </ul>
        `
      },
      {
        tabName: "구조 및 운영 방침",
        content: `
          <div class="desc-box">
            <b>[협회 규모 및 구조]</b><br>
            - <b>지상</b>: 철저한 위장막과 다중 보안 방벽으로 둘러싸인 거대 연구 관공서 빌딩 군[cite: 1].<br>
            - <b>지하</b>: 지하 수천 미터 깊이까지 수직으로 뚫려 있는 초대형 방공호 및 벙커 형태의 지하 요새. 깊이에 따라 하부 구역이 나뉨[cite: 1].
          </div>
          <ul>
            <li>인외를 '지능을 가진 생명'으로 취급하지 않음. 국가 안전을 위협하는 '잠재적 재앙 물질'이자 '관리 대상 표본'으로만 규정[cite: 1].</li>
            <li>가혹하고 기계적인 통제 시스템 아래에서 학대에 가까운 24시간 감시, 신경 억제, 물리적 구속이 합법적으로 집행됨[cite: 1].</li>
            <li>장기 수감으로 인한 신체·정신 붕괴를 막기 위해 하루 30분간 '정기 완충(산책) 시간'이 주어짐[cite: 1]. 억제구를 착용한 상태로 공용 홀에 모여 대치 중이며, 물리적 충돌 시 즉시 천장에서 신경 억제 가스가 살포됨[cite: 1].</li>
          </ul>
        `
      },
      {
        tabName: "자원 회수 & 구속 등급",
        content: `
          <div class="desc-box">
            <b>[자원 회수 시스템 (Extraction Protocol)]</b><br>
            A.C.A.의 숨겨진 주 수입원이자 운영 목적. 인외를 가둬두는 게 아니라, 개체가 뿜어내는 특수 물질을 착취해 국가/군사용 생체 병기나 특수 의약품으로 가공함[cite: 1]. 관리인은 이 착취 물질을 정기적으로 수거해 연구국에 넘겨야 함[cite: 1].<br>
            - <b>아야나</b>: 진주(초고밀도 바이러스 결정체) 및 혈액 추출[cite: 1]<br>
            - <b>지세르</b>: 발광 코어에서 추출한 초고농도 신경 마비 독소[cite: 1]<br>
            - <b>카르에</b>: 환각/시야 차단 먹물 및 촉수 표면의 경화 조직[cite: 1]
          </div>
          <b>[A.C.A. 프로토콜: 6단계 구속 수준 체계]</b>
          <ul>
            <li><b>Level D (최소 구속)</b>: 발목 억제 앵클릿, 기본 위치 추적기 착용[cite: 1]. 구역 내 자유 보행 가능[cite: 1].</li>
            <li><b>Level C (경미 구속)</b>: 경량 신경 억제 목걸이 부착 (위험 수치 도달 시 경고음)[cite: 1].</li>
            <li><b>Level B (표준 구속)</b>: 상체 금속 억제 사슬 및 전격 방출형 목걸이 상시 착용 (지세르/데젤 기본 단계)[cite: 1].</li>
            <li><b>Level A (중증 구속)</b>: 척추 및 주요 관절 초고압 억제 프레임, 다중 구속 사슬, 분비물 억제 마스크 (카르에 기본 단계)[cite: 1].</li>
            <li><b>Level S (극단 구속)</b>: 신경 전도 차단 수트 착용, 사지 영구 결박, 24시간 진정제 강제 투여 링거 부착 (아이리스 기본 단계)[cite: 1].</li>
            <li><b>Level 특급 (절대 격리)</b>: 감각 완전 차단 캡슐 밀봉, 의식 강제 동면 상태 유지[cite: 1].</li>
          </ul>
        `
      }
    ]
  },
  deepsea: {
    title: "제5 심해 격리구역 & 관리인",
    badges: ["SYSTEM", "PERSONNEL DATA"],
    tabs: [
      {
        tabName: "제5 심해 구역 (Deep-Sea Sector)",
        content: `
          지하 최심부, 초고압과 칠흑 같은 암흑을 재현한 '초대형 심해 인공 해역(해양 생태 돔)'[cite: 1].
          <ul>
            <li><b>평상시</b>: 수십 미터 높이의 특수 나노 강화 격벽이 내려와 각 개체의 수역을 철저히 분리 차단함[cite: 1].</li>
          </ul>
          <div class="desc-box">
            <b>[수중 개방 프로토콜 (Deep-Purge)]</b><br>
            1. <b>발생 주기</b>: 하루 1회, 40분간 집행[cite: 1].<br>
            2. <b>시스템</b>: 중앙 나노 격벽이 바닥과 천장으로 수납되며, 흩어져 있던 수생 인외들이 하나의 거대한 해역으로 합류함[cite: 1].<br>
            3. <b>비상 안전장치</b>: 유혈 사태나 물리적 가해 발생 시 즉각 '고농도 신경 마비 전도 전류' 및 '수중 청각 충격파'가 방출되어 기절시킴[cite: 1].<br>
            4. 완전 수생 인외는 수조 내 영구 격리되며, 양서형/지상 호흡 가능 인외만 지상 구역으로 이송됨[cite: 1].
          </div>
        `
      },
      {
        tabName: "관리인 및 부서 규정",
        content: `
          <b>[전속 관리관 (Specialized Handler)]</b><br>
          연구원이나 무장 경비 요원과 분리된 직군[cite: 1]. 인외의 '정신적 붕괴와 폭주'를 막기 위해 신체 접촉, 수분 공급, 영양 투여, 면담을 1:1로 전담하는 유일한 창구[cite: 1]. 위험 등급에 맞춰 배정되며, A급 이상은 목숨을 담보로 한 고위험 현장직임[cite: 1].
          <ul>
            <li><b>초고압 나노 잠수 슈트</b>: 심해 구역 진입 시 착용[cite: 1]. 헬멧 내부 통신기로 음파 변환 청취[cite: 1].</li>
            <li><b>비상 바이오 패치</b>: 독성 물질 노출 시 10초 내 해독하는 즉각 주사기[cite: 1].</li>
            <li><b><span class="highlight">Kill Switch (처분 권한 코드)</span></b>: 담당 인외의 억제구를 즉시 과부하시켜 심정지나 기절을 유도하는 비상 스위치[cite: 1].</li>
          </ul>
          <b>[A.C.A. 최고 통제 본부 시스템]</b><br>
          - <b>제1 통제국</b>: 무장 진압, 격리실 방벽 유지, 탈출 저지[cite: 1]<br>
          - <b>제2 연구국</b>: 원형 바이러스 추출, 생체 무기 개조, 해부 실험[cite: 1]<br>
          - <b>제3 관리국</b>: 유저 소속. 개체 심리 통제, 완충 프로토콜 집행[cite: 1]
        `
      }
    ]
  },
  karue: {
    title: "[A-084] 카르에 (KARUE)",
    badges: ["Level A", "지상 구역 - 제7 격리실", "두족류 심해 변이체"],
    tabs: [
      {
        tabName: "외형 및 인외 기믹",
        content: `
          <ul>
            <li><b>외형</b>: 헝클어지고 물기에 젖은 적갈색 머리칼, 서늘한 에메랄드빛 초록색 세로동공, 날카로운 상어 이빨[cite: 1].</li>
            <li>목과 척추를 따라 금속제 A급 억제 사슬이 감겨 있음[cite: 1]. 건조한 지상 공기에 노출되면 피부가 트고 메말라 투명한 점액질 체액을 흘림[cite: 1].</li>
          </ul>
          <div class="desc-box">
            <b>[독립 신경계 기믹]</b><br>

let currentMainId = 'agency';

function loadMainData(id, element) {
  currentMainId = id;
  
  const allBtns = document.querySelectorAll('.sidebar .char-btn');
  allBtns.forEach(btn => btn.classList.remove('active'));
  
  if (element) {
    element.classList.add('active');
  } else {
    allBtns[0].classList.add('active');
  }
  
  const data = db[id];
  
  let badgesHtml = '';
  data.badges.forEach(badgeTxt => {
    let style = badgeColors[badgeTxt] || "color: #c5c6c7; border-color: #c5c6c7;";
    badgesHtml += `<span class="badge" style="${style}">${badgeTxt}</span>`;
  });
  
  document.getElementById('content-header').innerHTML = `
    <h2 class="title">${data.title}</h2>
    ${badgesHtml}
  `;
  
  let tabsHtml = '';
  data.tabs.forEach((tab, index) => {
    tabsHtml += `<button class="sub-tab-btn ${index === 0 ? 'active' : ''}" onclick="switchSubTab(${index})">${tab.tabName}</button>`;
  });
  document.getElementById('sub-tabs').innerHTML = tabsHtml;
  
  switchSubTab(0);
}

function switchSubTab(tabIndex) {
  document.querySelectorAll('#sub-tabs .sub-tab-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx === tabIndex);
  });
  
  const contentHtml = db[currentMainId].tabs[tabIndex].content;
  document.getElementById('sub-content-area').innerHTML = contentHtml;
}

window.addEventListener('DOMContentLoaded', () => {
  loadMainData('agency', document.querySelector('.sidebar .char-btn'));
});
